name: Migrate couple_idea to Leyenda

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-couple-to-leyenda.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Leyenda
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current couple_idea
        run: |
          git clone --depth 1 --branch main https://github.com/AgustinWojtyszyn/couple_idea.git /tmp/couple_idea

      - name: Mirror source repository
        run: |
          rsync -a --delete --exclude=".git" /tmp/couple_idea/ "$GITHUB_WORKSPACE"/

      - name: Commit complete migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to migrate"
            exit 0
          fi
          git commit -m "chore: migrate complete couple_idea state to Leyenda"
          git push origin HEAD:main
