name: World League Data Sync

on:
  pull_request:
    branches: [main]
  push:
    branches: [world-data-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate world league catalog
        run: node scripts/sync-world-leagues.mjs
      - name: Install
        run: npm install
      - name: Build generated catalog
        run: npm run build
      - name: Commit generated catalog on sync branch
        if: github.event_name == 'push'
        run: |
          git config user.name "leyenda-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/verifiedLeagues.ts
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh verified world league catalog"
            git push origin HEAD:world-data-sync
          fi
